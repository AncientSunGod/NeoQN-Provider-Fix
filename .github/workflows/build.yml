name: Build NeoQN Fixed Providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'provider-overrides.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NeoQN v2.2.0 source
        run: |
          git clone --depth 1 --branch v2.2.0 \
            https://github.com/Shadyteal2/QuickNovel-Enhanced.git neoqn

      - name: Unpack provider overrides
        run: |
          unzip -q provider-overrides.zip -d neoqn

      - name: Add provider module
        working-directory: neoqn
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("settings.gradle.kts")
          s = p.read_text()

          if 'include(":provider")' not in s:
              s += '\ninclude(":provider")\n'

          p.write_text(s)
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Windows Java paths
        working-directory: neoqn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          lines = p.read_text().splitlines()

          bad_keys = (
              "org.gradle.java.home=",
              "org.gradle.java.installations.paths=",
              "com.android.build.jdk.java.home=",
          )

          lines = [
              line for line in lines
              if not line.startswith(bad_keys)
          ]

          p.write_text("\n".join(lines) + "\n")
          PY

          sed -i '/export JAVA_HOME="\/c\/Program Files\/Android\/Android Studio\/jbr"/d' gradlew

      - name: Use compatible Gradle
        working-directory: neoqn
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/gradle-8\.11\.1-bin\.zip/gradle-8.9-bin.zip/' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Build NeoQN app classes
        working-directory: neoqn
        shell: bash
        run: |
          chmod +x gradlew

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"

          ./gradlew --no-daemon \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac

      - name: Use NeoQN classes directly for provider
        working-directory: neoqn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("provider/build.gradle")
          s = p.read_text()

          old = "compileOnly project(':app')"

          new = """compileOnly files(
              "$rootDir/app/build/tmp/kotlin-classes/release",
              "$rootDir/app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes"
          )"""

          if old not in s:
              raise SystemExit(
                  "Could not find the expected compileOnly project(':app') line"
              )

          s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "Provider dependency now:"
          grep -A12 "^dependencies" provider/build.gradle

                    python3 - <<'PY'
          from pathlib import Path

          for p in Path("provider/src/main/java").rglob("*.kt"):
              s = p.read_text()
              if "app." in s and "import com.lagradost.quicknovel.app" not in s:
                  lines = s.splitlines()
                  package_index = next(
                      i for i, line in enumerate(lines)
                      if line.startswith("package ")
                  )
                  lines.insert(package_index + 1,
                               "import com.lagradost.quicknovel.app")
                  p.write_text("\n".join(lines) + "\n")
                  print("Added app import:", p)
          PY

      - name: Build provider APK
        working-directory: neoqn
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon \
            --rerun-tasks \
            :provider:assembleRelease

      - name: Show generated APK
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== GENERATED PROVIDER APK ====="
          find provider/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload provider APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoQN-Fixed-Providers
          path: neoqn/provider/build/outputs/apk/release/*.apk
          if-no-files-found: error
