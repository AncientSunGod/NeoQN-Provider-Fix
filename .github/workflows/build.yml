name: Build NeoQN Fixed Providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'provider-overrides.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Download NeoQN v2.2.0 source
        run: |
          git clone --depth 1 --branch v2.2.0 https://github.com/Shadyteal2/QuickNovel-Enhanced.git neoqn

      - name: Unpack provider overrides
        run: |
          unzip -q provider-overrides.zip -d neoqn
          mkdir -p neoqn/provider/src/main/java/com/lagradost/quicknovel/providers

      - name: Fetch current WTR-LAB provider
        run: |
          curl -fsSL https://raw.githubusercontent.com/LagradOst/QuickNovel/master/app/src/main/java/com/lagradost/quicknovel/providers/WtrLabProvider.kt \
            -o neoqn/provider/src/main/java/com/lagradost/quicknovel/providers/WtrLabProvider.kt
          sed -i 's/override val iconId = R.drawable.icon_wtrlab/override val iconId: Int? = null/' \
            neoqn/provider/src/main/java/com/lagradost/quicknovel/providers/WtrLabProvider.kt

      - name: Add provider module to NeoQN build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('neoqn/settings.gradle.kts')
          s = p.read_text()
          if 'include(":provider")' not in s:
              s += '\ninclude(":provider")\n'
          p.write_text(s)
          PY

      - name: Set up Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
         distribution: temurin
         java-version: '21'

      - name: Fix Windows Java paths
        working-directory: neoqn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          lines = p.read_text().splitlines()

          bad_keys = (
              "org.gradle.java.home=",
              "org.gradle.java.installations.paths=",
              "com.android.build.jdk.java.home=",
          )

          lines = [
              line for line in lines
              if not line.startswith(bad_keys)
          ]

          p.write_text("\n".join(lines) + "\n")
          PY

          # Remove the hard-coded Windows JAVA_HOME from gradlew
          sed -i '/export JAVA_HOME="\/c\/Program Files\/Android\/Android Studio\/jbr"/d' gradlew

          echo "Checking for remaining Windows Java paths:"
          grep -n -i "Program Files/Android/Android Studio\|org.gradle.java.home\|com.android.build.jdk.java.home" gradlew gradle.properties || true

      - name: Find provider files
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 4 -type f \( -name "build.gradle*" -o -name "AndroidManifest.xml" \) | sort

          echo "===== PROVIDER REFERENCES ====="
          find . -type f \( -name "build.gradle*" -o -name "AndroidManifest.xml" \) \
            -print0 | xargs -0 grep -l "provider" 2>/dev/null | head -50 || true
          
      - name: Diagnose provider build files
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== ALL BUILD FILES ====="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | sort

          echo "===== ALL PROVIDER FILES ====="
          find . -type f | grep -i "provider" | head -100

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== PROVIDER DIRECTORY ====="
          find provider -maxdepth 3 -type f -print 2>/dev/null || true
        
