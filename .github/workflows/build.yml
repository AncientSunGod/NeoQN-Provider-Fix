name: Build NeoQN Fixed Providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'provider-overrides.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download NeoQN v2.2.0 source
        run: |
          git clone --depth 1 --branch v2.2.0 \
            https://github.com/Shadyteal2/QuickNovel-Enhanced.git neoqn

      - name: Unpack provider overrides
        run: |
          unzip -q provider-overrides.zip -d neoqn
          mkdir -p neoqn/provider/src/main/java/com/lagradost/quicknovel/providers

      - name: Add provider module to NeoQN build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("neoqn/settings.gradle.kts")
          s = p.read_text()

          if 'include(":provider")' not in s:
              s += '\ninclude(":provider")\n'

          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Windows Java paths
        working-directory: neoqn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          lines = p.read_text().splitlines()

          bad_keys = (
              "org.gradle.java.home=",
              "org.gradle.java.installations.paths=",
              "com.android.build.jdk.java.home=",
          )

          lines = [
              line for line in lines
              if not line.startswith(bad_keys)
          ]

          p.write_text("\n".join(lines) + "\n")
          PY

          sed -i '/export JAVA_HOME="\/c\/Program Files\/Android\/Android Studio\/jbr"/d' gradlew

          chmod +x gradlew

      - name: Use compatible Gradle version
        working-directory: neoqn
        shell: bash
        run: |
          sed -i 's/gradle-8\.11\.1-bin\.zip/gradle-8.9-bin.zip/' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build NeoQN app classes
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== BUILDING MAIN APP CLASSES ====="

          chmod +x gradlew

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"

          echo "Using JAVA_HOME=$JAVA_HOME"

          ./gradlew --no-daemon \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac

      - name: Verify NeoQN API classes
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== CHECKING NEOQN API CLASSES ====="

          KOTLIN_CLASSES="app/build/tmp/kotlin-classes/release"
          JAVA_CLASSES="app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes"

          test -d "$KOTLIN_CLASSES" || {
            echo "ERROR: Kotlin class directory was not created."
            echo "$KOTLIN_CLASSES"
            exit 1
          }

          test -d "$JAVA_CLASSES" || {
            echo "ERROR: Java class directory was not created."
            echo "$JAVA_CLASSES"
            exit 1
          }

          echo ""
          echo "===== MainAPI ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "MainAPI.class" -print

          echo ""
          echo "===== MainAPIKt ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "MainAPIKt.class" -print

          echo ""
          echo "===== ChapterData ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "ChapterData.class" -print

          echo ""
          echo "===== LoadResponse ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "LoadResponse.class" -print

          echo ""
          echo "===== SearchResponse ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "SearchResponse.class" -print

          echo ""
          echo "===== WebViewResolver ====="
          find "$KOTLIN_CLASSES" "$JAVA_CLASSES" \
            -name "WebViewResolver.class" -print

          echo ""
          echo "===== Kotlin metadata ====="
          find "$KOTLIN_CLASSES/META-INF" \
            -name "*.kotlin_module" -print || true

      - name: Create NeoQN provider API JAR
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== CREATING PROVIDER API JAR ====="

          KOTLIN_CLASSES="app/build/tmp/kotlin-classes/release"
          JAVA_CLASSES="app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes"

          API_DIR="$PWD/provider-api-classes"
          API_JAR="$PWD/provider-api.jar"

          test -d "$KOTLIN_CLASSES" || {
            echo "ERROR: Kotlin classes directory missing."
            exit 1
          }

          test -d "$JAVA_CLASSES" || {
            echo "ERROR: Java classes directory missing."
            exit 1
          }

          rm -rf "$API_DIR"
          rm -f "$API_JAR"

          mkdir -p "$API_DIR"

          echo "Copying Kotlin classes..."
          cp -a "$KOTLIN_CLASSES"/. "$API_DIR"/

          echo "Copying Java classes..."
          cp -a "$JAVA_CLASSES"/. "$API_DIR"/

          echo ""
          echo "Creating:"
          echo "$API_JAR"

          jar --create \
            --file "$API_JAR" \
            -C "$API_DIR" .

          echo ""
          echo "===== VERIFYING PROVIDER API JAR ====="

          test -f "$API_JAR" || {
            echo "ERROR: provider-api.jar was not created."
            exit 1
          }

          echo ""
          echo "Required NeoQN classes:"

          jar tf "$API_JAR" | grep -E \
            'com/lagradost/quicknovel/(MainAPI|MainAPIKt|ChapterData|LoadResponse|SearchResponse)\.class' \
            || {
              echo "ERROR: Required NeoQN API classes are missing."
              exit 1
            }

          echo ""
          echo "Kotlin metadata:"

          jar tf "$API_JAR" | grep \
            'META-INF/.*\.kotlin_module' \
            || {
              echo "ERROR: Kotlin module metadata is missing."
              exit 1
            }

          echo ""
          echo "===== API JAR CONTENT CHECK ====="

          jar tf "$API_JAR" | grep -E \
            'com/lagradost/quicknovel/(MainAPI|MainAPIKt|ChapterData|LoadResponse|SearchResponse)\.class'

          echo ""
          jar tf "$API_JAR" | grep \
            'META-INF/.*\.kotlin_module'

          echo ""
          echo "===== API JAR CREATED SUCCESSFULLY ====="
          ls -lh "$API_JAR"

      - name: Connect provider to NeoQN API JAR
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== CONNECTING PROVIDER TO NEOQN API JAR ====="

          test -f provider-api.jar || {
            echo "ERROR: provider-api.jar does not exist."
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          p = Path("provider/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ERROR: provider/build.gradle does not exist."
              )

          s = p.read_text()

          old = "compileOnly project(':app')"

          new = 'compileOnly files("$rootDir/provider-api.jar")'

          if old not in s:
              raise SystemExit(
                  "ERROR: Could not find "
                  "compileOnly project(':app') "
                  "in provider/build.gradle"
              )

          s = s.replace(old, new)

          p.write_text(s)

          print("Provider dependency successfully changed.")
          PY

          echo ""
          echo "===== PROVIDER DEPENDENCIES ====="

          grep -A20 "^dependencies" provider/build.gradle

          echo ""
          echo "===== VERIFYING API JAR DEPENDENCY ====="

          grep -q 'compileOnly files("$rootDir/provider-api.jar")' \
            provider/build.gradle \
            || {
              echo "ERROR: provider-api.jar dependency was not added."
              exit 1
            }

          echo ""
          echo "Provider is connected to provider-api.jar."

      - name: Add NeoQN app import to providers
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          provider_root = Path(
              "provider/src/main/java/com/lagradost/quicknovel/providers"
          )

          if not provider_root.exists():
              raise SystemExit(
                  "ERROR: Provider source directory does not exist."
              )

          for p in provider_root.rglob("*.kt"):
              s = p.read_text()

              if "app." not in s:
                  continue

              if "import com.lagradost.quicknovel.app" in s:
                  continue

              lines = s.splitlines()

              package_index = None
              first_import_index = None

              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      package_index = i

                  if (
                      line.startswith("import ")
                      and first_import_index is None
                  ):
                      first_import_index = i

              if package_index is None:
                  raise SystemExit(
                      f"ERROR: No package declaration found in {p}"
                  )

              insert_at = (
                  first_import_index
                  if first_import_index is not None
                  else package_index + 1
              )

              lines.insert(
                  insert_at,
                  "import com.lagradost.quicknovel.app"
              )

              p.write_text("\n".join(lines) + "\n")

              print(f"Added app import: {p}")

      - name: Verify provider configuration
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== PROVIDER SOURCES ====="

          find provider/src/main/java \
            -type f \
            -name "*.kt" \
            -print

          echo ""
          echo "===== PROVIDER BUILD FILE ====="

          grep -A20 "^dependencies" provider/build.gradle

          echo ""
          echo "===== CHECKING FOR OLD APP DEPENDENCY ====="

          if grep -q "compileOnly project(':app')" provider/build.gradle; then
            echo "ERROR: Old project dependency is still present."
            exit 1
          fi

          echo ""
          echo "===== CHECKING FOR NEW API JAR DEPENDENCY ====="

          if ! grep -q \
            'compileOnly files("$rootDir/provider-api.jar")' \
            provider/build.gradle; then

            echo "ERROR: provider-api.jar dependency is missing."
            exit 1
          fi

          echo ""
          echo "Provider configuration is correct."

      - name: Build provider APK
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== BUILDING PROVIDER APK ====="

          chmod +x gradlew

          ./gradlew --no-daemon \
            --rerun-tasks \
            :provider:assembleRelease

      - name: Locate provider APK
        working-directory: neoqn
        shell: bash
        run: |
          set -e

          echo "===== PROVIDER APK ====="

          find provider/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload provider APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoQN-Fixed-Providers
          path: neoqn/provider/build/outputs/apk/release/*.apk
          if-no-files-found: error
