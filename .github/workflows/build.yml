name: Build NeoQN Fixed Providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'provider-overrides.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Download NeoQN v2.2.0 source
        run: |
          git clone --depth 1 --branch v2.2.0 https://github.com/Shadyteal2/QuickNovel-Enhanced.git neoqn

      - name: Unpack provider overrides
        run: |
          unzip -q provider-overrides.zip -d neoqn
          mkdir -p neoqn/provider/src/main/java/com/lagradost/quicknovel/providers

      
      - name: Add provider module to NeoQN build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('neoqn/settings.gradle.kts')
          s = p.read_text()
          if 'include(":provider")' not in s:
              s += '\ninclude(":provider")\n'
          p.write_text(s)
          PY

      - name: Set up Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
         distribution: temurin
         java-version: '21'

      - name: Fix Windows Java paths
        working-directory: neoqn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          lines = p.read_text().splitlines()

          bad_keys = (
              "org.gradle.java.home=",
              "org.gradle.java.installations.paths=",
              "com.android.build.jdk.java.home=",
          )

          lines = [
              line for line in lines
              if not line.startswith(bad_keys)
          ]

          p.write_text("\n".join(lines) + "\n")
          PY

          # Remove the hard-coded Windows JAVA_HOME from gradlew
          sed -i '/export JAVA_HOME="\/c\/Program Files\/Android\/Android Studio\/jbr"/d' gradlew

          echo "Checking for remaining Windows Java paths:"
          grep -n -i "Program Files/Android/Android Studio\|org.gradle.java.home\|com.android.build.jdk.java.home" gradlew gradle.properties || true

      - name: Use compatible Gradle version
        working-directory: neoqn
        shell: bash
        run: |
          chmod +x gradlew
          sed -i 's/gradle-8\.11\.1-bin\.zip/gradle-8.9-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          echo "Using Gradle wrapper:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build NeoQN app classes for provider API
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== BUILDING MAIN APP CLASSES ====="

          chmod +x gradlew

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          echo "Using JAVA_HOME=$JAVA_HOME"

          ./gradlew --no-daemon :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac

          echo ""
          echo "===== JAVA CLASS OUTPUTS ====="
          find app/build -type d \( \
            -path "*kotlin-classes/release" -o \
            -path "*javac/release/*/classes" -o \
            -path "*java-classes/release" \
          \) -print

          echo ""
          echo "===== SEARCHING FOR MainAPI.class ====="
          find app/build -name "MainAPI.class" -print

          echo ""
          echo "===== SEARCHING FOR R.class ====="
          find app/build -name "R.class" -print

          echo ""
          echo "===== SEARCHING FOR WebViewResolver.class ====="
          find app/build -name "WebViewResolver.class" -print

      - name: Find provider API classes
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== PROVIDER API CLASSES ====="

          echo ""
          echo "----- Main Kotlin/Java classes -----"
          for cls in \
            MainAPI \
            ChapterData \
            ErrorLoadingException \
            HeadMainPageResponse \
            LoadResponse \
            SearchResponse \
            UserReview
          do
            echo "=== $cls ==="
            find app/build/tmp/kotlin-classes/release \
                 app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes \
                 -name "$cls.class" -print
          done

          echo ""
          echo "----- Network classes -----"
          find app/build/tmp/kotlin-classes/release \
               app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes \
               -name "WebViewResolver.class" -print

          echo ""
          echo "----- Utility classes -----"
          find app/build/tmp/kotlin-classes/release \
               app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes \
               -path "*util*" -name "*.class" | grep "AppUtils" || true

          echo ""
          echo "----- R classes -----"
          find app/build -type f -name "R.class" -o -name "R\$*.class" | sort


      - name: Create provider API JAR
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== CREATING PROVIDER API JAR ====="

          rm -rf provider-api-classes
          mkdir -p provider-api-classes

          cp -R app/build/tmp/kotlin-classes/release/com provider-api-classes/
          cp -R app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes/com provider-api-classes/ 2>/dev/null || true

          cd provider-api-classes

          jar cf ../provider-api.jar com

          cd ..

          echo ""
          echo "===== PROVIDER API JAR ====="
          ls -lh provider-api.jar

          echo ""
          echo "===== JAR CONTENTS ====="
          jar tf provider-api.jar | grep -E \
            'MainAPI|ChapterData|ErrorLoadingException|HeadMainPageResponse|LoadResponse|SearchResponse|UserReview|WebViewResolver|AppUtils' \
            | head -100

      - name: Change provider dependency
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== CHANGING PROVIDER DEPENDENCY ====="

          sed -i 's|compileOnly project('\''\:app'\'')|compileOnly files("$rootDir/provider-api.jar")|' provider/build.gradle

          echo ""
          echo "===== PROVIDER DEPENDENCIES ====="
          grep -A10 "^dependencies" provider/build.gradle

      - name: Build provider APK
        working-directory: neoqn
        shell: bash
        run: |
          echo "===== BUILDING PROVIDER APK ====="
          chmod +x gradlew
          ./gradlew --no-daemon --rerun-tasks :provider:assembleRelease
